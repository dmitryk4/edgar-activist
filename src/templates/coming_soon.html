<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Activist Ownership Research</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      background: #1e293b;
      display: flex;
      gap: 4px;
      padding: 0 24px;
    }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      padding: 14px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover  { color: #fff; }
    .nav-link.active { color: #fff; border-bottom-color: #3b82f6; }
    .nav-link.soon   { color: #64748b; font-style: italic; cursor: default; }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 50px);
      padding: 40px 16px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      max-width: 400px;
      line-height: 1.6;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-link {% if active == 'scraper' %}active{% endif %}">Holdings Scraper</a>
  <a href="/vic" class="nav-link {% if active == 'vic' %}active{% endif %}">VIC Universe</a>
  <a href="/sumzero" class="nav-link {% if active == 'sumzero' %}active{% else %}soon{% endif %}">SumZero</a>
  <a href="/seekingalpha" class="nav-link {% if active == 'seekingalpha' %}active{% else %}soon{% endif %}">Seeking Alpha</a>
  <a href="/microcapclub" class="nav-link {% if active == 'microcapclub' %}active{% else %}soon{% endif %}">Microcap Club</a>
</nav>

<div class="container">
  <div class="icon">🚧</div>
  <div class="badge">Coming Soon</div>
  <h1>{{ title }}</h1>
  <p>{{ description }}</p>
</div>

</body>
</html>
