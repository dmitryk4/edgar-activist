<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIC Universe — Activist Ownership Research</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      background: #1e293b;
      display: flex;
      gap: 4px;
      padding: 0 24px;
      margin-bottom: 40px;
    }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      padding: 14px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover  { color: #fff; }
    .nav-link.active { color: #fff; border-bottom-color: #3b82f6; }
    .nav-link.soon   { color: #64748b; font-style: italic; }

    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    header { margin-bottom: 28px; }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { color: #64748b; margin-top: 6px; font-size: 0.95rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }

    thead th {
      background: #1e293b;
      color: #e2e8f0;
      text-align: left;
      padding: 13px 18px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    td { padding: 14px 18px; vertical-align: middle; }

    .ticker {
      font-weight: 700;
      font-size: 1rem;
      color: #1e293b;
      font-family: 'Cascadia Code', Consolas, monospace;
      letter-spacing: 0.05em;
    }

    .company { color: #374151; font-size: 0.95rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-vic    { background: #1d4ed8; color: #fff; }
    .btn-vic:hover   { background: #1e40af; }
    .btn-edgar  { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-edgar:hover { background: #e2e8f0; }
    .btn-scrape { background: #059669; color: #fff; }
    .btn-scrape:hover { background: #047857; }

    .links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-link">Holdings Scraper</a>
  <a href="/vic" class="nav-link active">VIC Universe</a>
  <a href="/sumzero" class="nav-link soon">SumZero</a>
  <a href="/seekingalpha" class="nav-link soon">Seeking Alpha</a>
  <a href="/microcapclub" class="nav-link soon">Microcap Club</a>
</nav>

<div class="page">
  <header>
    <h1>VIC Universe</h1>
    <p>Value Investors Club idea universe — US-listed, US-headquartered micro-caps.</p>
  </header>

  <table>
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Company</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for co in universe %}
      <tr>
        <td class="ticker">{{ co.ticker }}</td>
        <td class="company">{{ co.name }}</td>
        <td>
          <div class="links">
            <a class="btn btn-vic"    href="{{ co.vic_url }}"   target="_blank" rel="noopener">VIC&nbsp;→</a>
            <a class="btn btn-edgar"  href="{{ co.edgar_url }}" target="_blank" rel="noopener">EDGAR&nbsp;→</a>
            <a class="btn btn-scrape" href="/?ticker={{ co.ticker }}">Scrape Holdings&nbsp;→</a>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
